# Publishes the container image to the GitHub Container Registry when a version tag is
# pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# produces ghcr.io/sennlabs/vedette:0.1.0, :0.1 and :latest. The package is private
# after its first push; set it to public in the package settings on GitHub.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

# Two tags pushed together must not race each other onto `latest`.
concurrency:
  group: release-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        run: |
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "v${crate}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sennlabs/vedette
          # `latest` is added automatically for a non-prerelease semver tag, so a
          # v1.2.0-rc1 publishes 1.2.0-rc1 only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # No provenance manifest: it shows up as an "unknown/unknown" platform entry
          # in the registry UI and this project does not consume it.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
